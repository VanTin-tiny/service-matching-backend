version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: local_postgres
    environment:
      POSTGRES_DB: service_matching
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 10101978
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: on-failure

  redis:
    image: redis:7-alpine
    container_name: local_redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: on-failure

volumes:
  postgres_data:


networks:
  app-network:
    driver: bridge
