name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint
    
    - name: Run tests
      run: npm run test -- --passWithNoTests
    
    - name: Create moderation config file
      run: |
        echo "export default { patterns: [] };" > src/modules/moderation/config/moderation-patterns.config.ts

    
    - name: Build application
      run: npm run build

    - name: Check /auth/health
      run: |
        echo "Checking health endpoint..."
        curl -f http://localhost:3000/api/v1/auth/health | tee health.json

 
